<title>DU Science Unit — Preparation Dashboard</title>

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 12px 70px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;margin:0 -12px 6px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:var(--acc);color:var(--onacc);border:0}
.hero .mut{color:inherit;opacity:.8}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:18px;margin:16px 0 6px}
h3{font-size:15px}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px}
.mut{color:var(--mut);font-size:13px}
.sm{font-size:13px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media(min-width:560px){.grid4{grid-template-columns:repeat(4,1fr)}}
.stat{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:19px}
.card .stat{background:var(--bg)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.hero .bar{background:rgba(255,255,255,.25)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.hero .bar i{background:var(--onacc)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut);margin:0 4px 4px 0}
.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.chip.good{background:var(--accbg);color:var(--good);border-color:transparent}
.chip.t1{background:var(--accbg);color:var(--acc);border-color:transparent;font-weight:600}
.btn{border:0;background:var(--acc);color:var(--onacc);padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:70px}
label.f{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sg{margin:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline;border-left:4px solid var(--sc);padding-left:8px}
.sg b{font-size:16px}
.task{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:12px;padding:10px;margin:6px 0}
.task.done{opacity:.55}
.task.done .tt{text-decoration:line-through}
.task input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc);margin:2px 0 0;flex:0 0 auto;padding:0}
.tb{flex:1;min-width:0}
.tt{font-weight:600;font-size:15px}
.td{font-size:13.5px;color:var(--mut);margin-top:3px}
.why{font-size:12.5px;color:var(--acc);margin-top:3px}
.dur{font-size:13px;color:var(--mut);white-space:nowrap}
.coach{border-left:4px solid var(--acc)}
.coach.warn{border-left-color:var(--warn);background:var(--warnbg)}
.coach p{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;min-width:130px}
th{cursor:pointer;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
.scroll{overflow-x:auto}
.hb{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--mut);text-align:center}
.cell{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 2px;text-align:center;font:inherit;color:var(--ink);cursor:pointer;min-height:54px}
.cell b{display:block;font-size:15px}
.cell small{font-size:10.5px;color:var(--mut)}
.cell.sel{outline:2px solid var(--acc)}
.cell.today{border-color:var(--acc);border-width:2px}
.cell.ok{background:var(--accbg)}
.cell.part{background:var(--warnbg)}
.cell.miss{background:var(--badbg)}
.cell.exam{background:var(--acc);color:var(--onacc)}
.cell.exam small{color:var(--onacc)}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}
.chart div.col{flex:1;position:relative;height:100%;display:flex;align-items:flex-end}
.chart .p{position:absolute;bottom:0;left:0;right:0;background:var(--line);border-radius:3px}
.chart .a{position:absolute;bottom:0;left:18%;right:18%;background:var(--acc);border-radius:3px}
.lab{display:flex;gap:3px;font-size:10px;color:var(--mut)}
.lab span{flex:1;text-align:center}
details{margin:6px 0}
summary{cursor:pointer;font-weight:600;padding:6px 0}
.pill{display:inline-flex;gap:6px;align-items:center}
.err{border-left:4px solid var(--bad)}
.err.res{border-left-color:var(--good);opacity:.65}
ul.t{margin:4px 0 4px 18px;padding:0}
ul.t li{margin:3px 0}
</style>
</head>

function push(n,ch,kind,mins,title,detail,m,w,d,opt,slot){TASKS.push({id:'t'+(++SEQ),date:addDays(START,n),ch:ch,kind:kind,mins:mins,title:title,detail:detail||'',m:m||0,w:w||0,d:d||0,opt:!!opt,slot:slot||0});}
function add(n,ch,kind,mins,title,detail,m,w,d,opt,slot){
 m=m||0;w=w||0;d=d||0;detail=detail||'';
 if(kind==='practice'){
  if(m>0&&(w+d)>0&&mins>=25){
   const a=Math.max(10,Math.round(mins*0.55/5)*5);
   push(n,ch,'mcq',a,'MCQ practice — '+title,m+' chapter MCQs at about 45–60 s each; mark every doubtful one. '+detail,m,0,0,opt);
   const parts=[];if(d)parts.push(d+' previous-year DU question'+(d===1?'':'s'));if(w)parts.push(w+' written question'+(w===1?'':'s'));
   push(n,ch,'du',mins-a,'DU + written — '+title,'Solve '+parts.join(' and ')+'. For written answers: formula → substitution → units/steps, one clean method.',0,w,d,opt);
  }else if(m>0){push(n,ch,'mcq',mins,'Practice — '+title,detail+(d?' Include '+d+' DU question'+(d===1?'':'s')+'.':''),m,w,d,opt);}
  else{push(n,ch,'du',mins,'Written — '+title,detail||('Solve '+w+' written question(s) step by step.'),0,w,d,opt);}
 }else push(n,ch,kind,mins,title,detail,m,w,d,opt,slot);
}

 '<label class="f">Subject</label><select id="mk_s" data-draft="1">'+['All subjects','Physics','Chemistry','Biology','Higher Math'].map(x=>'<option'+(dv('mk_s','')===x?' selected':'')+'>'+x+'</option>').join('')+'</select>'+
 '<div class="three"><div><label class="f">Total Qs</label><input id="mk_n" data-draft="1" inputmode="numeric" value="'+esc(dv('mk_n',''))+'"></div><div><label class="f">Correct</label><input id="mk_c" data-draft="1" inputmode="numeric" value="'+esc(dv('mk_c',''))+'"></div><div><label class="f">Incorrect</label><input id="mk_w" data-draft="1" inputmode="numeric" value="'+esc(dv('mk_w',''))+'"></div></div>'+
 '<label class="f">Weakest chapter 1</label><select id="mk_w1" data-draft="1">'+chOptions(dv('mk_w1',''),true)+'</select><label class="f">Weakest chapter 2</label><select id="mk_w2" data-draft="1">'+chOptions(dv('mk_w2',''),true)+'</select>'+
 '<label class="f">Topics to improve</label><textarea id="mk_x" data-draft="1">'+esc(dv('mk_x',''))+'</textarea><div style="margin-top:10px"><button class="btn" data-act="addmock">Save result</button></div><p class="mut sm">Score = correct − 0.25 × incorrect. Chapters you flag here get extra repair time automatically.</p></div>';
 const ms=S.mocks.slice().sort((a,b)=>a.date<b.date?1:-1);
 if(!ms.length)h+='<div class="card mut">No mocks logged yet. Planned: 29 Nov (mini), 3 Dec (sectional), 6 Dec, 8 Dec and 10 Dec (full).</div>';
 if(ms.length>1){const mx=Math.max.apply(null,ms.map(m=>m.score))||1;h+='<div class="card"><h3>Score trend</h3>'+ms.slice().reverse().map(m=>'<div class="hb" style="grid-template-columns:100px 1fr 50px"><span>'+fmtS(m.date)+' '+esc(m.type)+'</span>'+bar(Math.max(0,m.score)/mx*100)+'<span>'+m.score+'</span></div>').join('')+'</div>';}
 ms.forEach(m=>{h+='<div class="card"><div class="row"><div><b>'+fmt(m.date)+' — '+esc(m.type)+'</b><div class="mut sm">'+esc(m.subj)+'</div></div><div style="text-align:right"><b>'+m.score+'</b><div class="mut sm">'+m.acc+'% accuracy</div></div></div><div class="mut sm">'+m.total+' Qs · '+m.correct+' correct · '+m.wrong+' wrong · '+m.skipped+' skipped</div>'+
  ((m.weak1||m.weak2)?'<div style="margin-top:4px">'+[m.weak1,m.weak2].filter(Boolean).map(x=>'<span class="chip bad">'+esc(CH[x]?CH[x].name:x)+'</span>').join('')+'</div>':'')+(m.note?'<div class="sm" style="margin-top:4px">'+esc(m.note)+'</div>':'')+'<button class="btn ghost sm" style="margin-top:6px" data-act="delmock" data-id="'+m.id+'">Delete</button></div>';});
 return h;
}
function viewMore(){
 const pf=perf();
 let h='<h2>Strategy & settings</h2>';
 h+='<div class="card"><h3>How the coach works</h3><ul class="t sm"><li>Every day is pre-assigned. Tick tasks as you finish them.</li><li>At the end of the day, save the check-in. Unfinished Learn and Revise tasks move to the next day with free space, highest priority first. At most 90 minutes of carry-over lands on any day.</li><li>Optional and flex tasks are dropped first to make room. Low-priority chapters (Tier 3–4) are postponed, never piled up.</li><li>A task missed twice is split into two shorter parts.</li><li>Three or more unresolved errors (or a chapter flagged in a mock) add a 30-minute repair task.</li><li>Two days under 65% complete switch on Lite mode. Two full days switch on Push mode.</li><li>Sleep is never traded for hours: every day is capped at about 8 h of tasks.</li></ul><p class="sm">Current mode: <b>'+pf.mode+'</b>'+(pf.why?' ('+pf.why+')':'')+'</p></div>';
 h+='<details class="card"><summary>Tier system (by paper)</summary><div class="sm">'+Object.keys(PAPERS).map(k=>{const cs=CHAPS.filter(c=>c.p===k);return '<p><b>'+PAPERS[k][1]+(k[0]==='B'?' (DU-based)':'')+'</b><br>'+[1,2,3,4].map(t=>'T'+t+': '+(cs.filter(c=>c.tier===t).map(c=>c.name).join(', ')||'—')).join('<br>')+'</p>';}).join('')+'</div></details>';
 h+='<details class="card"><summary>Organic Chemistry crash plan</summary><div class="sm"><p>You will not watch all 31 lectures (about 60 hours). Budget about 17 hours of Organic across the 19 days and watch only the lectures matching this order at 1.5×, skipping derivations: IUPAC and hybridisation → isomerism (63) → electronic effects → alkanes/alkenes/alkynes (62) → aromatics (59) → alkyl halides, alcohols, phenols → carbonyl (71) → acids & amines (57) → conversions.</p><p><b>Skip unless time remains:</b> R/S stereochemistry, polymers, biomolecules.</p><p><b>Method:</b> one card per reaction (reagent → product → condition). MCQs test ordering, naming, products and distinguishing tests. Written questions are conversions and short mechanisms.</p></div></details>';
 h+='<details class="card"><summary>Exam tactics</summary><ul class="t sm"><li>MCQ 60 marks / 45 min (45 s each). Written 40 marks / 45 min. Wrong MCQ = −0.25.</li><li>Blind guessing is not worth it (expected gain about +0.06). With two options eliminated it is about +0.37, so answer then.</li><li>First pass: certain answers. Second pass: eliminate. Skip the rest.</li><li>Written: about 1 minute per mark. Formula, substitution, units, one clean method.</li><li>Mocks: 29 Nov (mini), 3 Dec (sectional), 6, 8, 10 Dec (full). Review for 60–90 minutes after each.</li><li>Check the official circular for the exact subject mark split and whether your department needs Biology or Math.</li></ul></details>';
 h+='<div class="card"><h3>Settings</h3><label class="f">Pretend today is (testing only; clear to use the real date)</label><input type="date" data-chg="override" value="'+esc(S.settings.override||'')+'">'+
 '<label class="f">Coach mode</label><select data-chg="mode">'+[['auto','Automatic'],['lite','Lite'],['normal','Normal'],['push','Push']].map(x=>'<option value="'+x[0]+'"'+(S.settings.mode===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select>'+
 '<p class="mut sm">Saving: '+(Store.ok?'<b>on</b> (this browser)':'<b>off</b> in this preview. Open the downloaded file in Chrome.')+'</p></div>';
 h+='<div class="card"><h3>Backup</h3><p class="sm mut">Copy this text somewhere safe. To restore, paste it into the box and tap Import.</p><textarea id="bk" data-draft="1" style="min-height:90px">'+esc(dv('bk',JSON.stringify(S)))+'</textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost sm" data-act="bksel">Select all</button><button class="btn sm" data-act="bkimp">Import</button></div></div>';
 h+='<div class="card"><h3>Reset</h3>'+(UI.resetOpen?'<p class="sm">Type RESET to erase all progress, errors and mocks.</p><input id="rs" data-draft="1" value="'+esc(dv('rs',''))+'"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn bad sm" data-act="reset">Erase everything</button><button class="btn ghost sm" data-act="resetx">Cancel</button></div>':'<button class="btn bad sm" data-act="resetq">Reset all progress…</button>')+'</div>';
 return h;
}
/* ================= RENDER ================= */
const TABS=[['today','Today'],['plan','Plan'],['chapters','Chapters'],['analysis','Analysis'],['progress','Progress'],['errors','Errors'],['mocks','Mocks'],['more','More']];
function render(){
 const y=window.pageYOffset||0;
 let body='';
 try{body={today:viewToday,plan:viewPlan,chapters:viewChapters,analysis:viewAnalysis,progress:viewProgress,errors:viewErrors,mocks:viewMocks,more:viewMore}[UI.tab]();}catch(e){body='<div class="card coach warn"><b>Display error.</b><p class="sm">'+esc(e&&e.message)+'</p></div>';}
 const flash=UI.flash?'<div class="card coach"><p>'+esc(UI.flash)+'</p></div>':'';UI.flash='';
 document.getElementById('app').innerHTML='<div class="tabs">'+TABS.map(x=>'<button class="tab'+(UI.tab===x[0]?' on':'')+'" data-act="tab" data-t="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+flash+body;
 window.scrollTo(0,y);
}
/* ================= EVENTS ================= */
const num=id=>{const v=UI.draft[id];return v===undefined||v===''?null:+v;};
const A={
 tab(el){UI.tab=el.dataset.t;window.scrollTo(0,0);render();},
 selday(el){UI.planSel=el.dataset.d;render();},
 chf(el){UI.chFilter=el.dataset.s;render();},
 errf(el){UI.errFilter=el.dataset.f;render();},
 asort(el){const k=el.dataset.k;if(UI.aSort===k)UI.aDir*=-1;else{UI.aSort=k;UI.aDir=k==='name'||k==='tier'?1:-1;}render();},
 restore(el){delete S.dropped[el.dataset.id];delete S.dropInfo[el.dataset.id];save();render();},
 checkin(){
  const t=today(),st=dayStats(curDay()),g=id=>UI.draft[id]!==undefined?UI.draft[id]:(S.checkins[t]&&S.checkins[t][{ci_h:'hours',ci_m:'m',ci_c:'c',ci_w:'w',ci_d:'d',ci_hard:'hard'}[id]]);
  S.checkins[t]={hours:g('ci_h'),m:g('ci_m'),c:g('ci_c'),w:g('ci_w'),d:g('ci_d'),hard:g('ci_hard')||'',submitted:true,plan:st.planned,doneMin:st.doneMin};
  ['ci_h','ci_m','ci_c','ci_w','ci_d','ci_hard'].forEach(k=>delete UI.draft[k]);
  const m=runAdjust(true);UI.flash='Check-in saved. '+(m.length?m.length+' change'+(m.length===1?'':'s')+' made to your upcoming plan.':'Your plan is unchanged.');render();
 },
 adderr(){
  const tx=(UI.draft.er_tx||'').trim();if(!tx){UI.flash='Write what went wrong before saving.';render();return;}
  S.errors.push({id:'e'+Date.now(),date:today(),ch:UI.draft.er_ch||'',type:UI.draft.er_ty||'Wrong question',text:tx,resolved:false,rev:0,last:null});
  delete UI.draft.er_tx;runAdjust(false);UI.flash='Error saved.';render();
 },
 reviewed(el){const e=S.errors.find(x=>x.id===el.dataset.id);if(e){e.rev=(e.rev||0)+1;e.last=today();if(e.rev>=3){e.resolved=true;UI.flash='Redone three times. Marked resolved.';}}save();render();},
 resolve(el){const e=S.errors.find(x=>x.id===el.dataset.id);if(e)e.resolved=true;save();render();},
 reopen(el){const e=S.errors.find(x=>x.id===el.dataset.id);if(e){e.resolved=false;e.rev=0;}save();render();},
 delerr(el){S.errors=S.errors.filter(x=>x.id!==el.dataset.id);save();render();},
 addmock(){
  const n=num('mk_n'),c=num('mk_c'),w=num('mk_w');
  if(n==null||c==null||w==null||c+w>n){UI.flash='Enter total, correct and incorrect. Correct + incorrect cannot exceed the total.';render();return;}
  S.mocks.push({id:'m'+Date.now(),date:UI.draft.mk_d||today(),type:UI.draft.mk_t||'Full mock',subj:UI.draft.mk_s||'All subjects',total:n,correct:c,wrong:w,skipped:n-c-w,score:Math.round((c-0.25*w)*100)/100,acc:(c+w)?Math.round(c/(c+w)*100):0,weak1:UI.draft.mk_w1||'',weak2:UI.draft.mk_w2||'',note:UI.draft.mk_x||''});
  ['mk_n','mk_c','mk_w','mk_x','mk_w1','mk_w2'].forEach(k=>delete UI.draft[k]);
  runAdjust(false);UI.flash='Mock saved.';render();
 },
 delmock(el){S.mocks=S.mocks.filter(x=>x.id!==el.dataset.id);save();render();},
 bksel(){const b=document.getElementById('bk');if(b){b.focus();b.select();}},
 bkimp(){try{const o=JSON.parse(UI.draft.bk||'');if(!o||typeof o!=='object'||!o.done)throw new Error('bad');S=Object.assign(defaults(),o);S.settings=Object.assign({override:'',mode:'auto'},S.settings||{});delete UI.draft.bk;save();UI.flash='Backup imported.';}catch(e){UI.flash='That backup text could not be read. Paste the full text and try again.';}render();},
 resetq(){UI.resetOpen=true;render();},
 resetx(){UI.resetOpen=false;delete UI.draft.rs;render();},
 reset(){if((UI.draft.rs||'').trim()==='RESET'){S=defaults();UI.draft={};UI.resetOpen=false;save();UI.flash='Everything has been reset.';}else UI.flash='Type RESET exactly to confirm.';render();}
};
const C={
 toggle(el){const id=el.dataset.id;if(el.checked)S.done[id]=today();else delete S.done[id];save();render();},
 chstatus(el){S.chStatus[el.dataset.id]=el.value;save();render();},
 apaper(el){UI.aPaper=el.value;UI.aSort='score';UI.aDir=-1;render();},
 override(el){S.settings.override=el.value||'';runAdjust(false);render();},
 mode(el){S.settings.mode=el.value;runAdjust(false);render();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el,e);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&C[el.dataset.chg])C[el.dataset.chg](el,e);else if(e.target.dataset&&e.target.dataset.draft){UI.draft[e.target.id]=e.target.value;}});
document.addEventListener('input',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.draft)UI.draft[el.id]=el.value;});
/* ================= INIT ================= */
runAdjust(false);
render();
window.__app={S:function(){return S;},UI:UI,render:render,TASKS:TASKS,A:A,C:C,views:{viewToday,viewPlan,viewChapters,viewAnalysis,viewProgress,viewErrors,viewMocks,viewMore},rebalance:rebalance,runAdjust:runAdjust,dayStats:dayStats,DAYS:DAYS};
})();
</script>
</body>
</html>
